{{- if and .Values.langfuse.gateway.enabled .Values.langfuse.gateway.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "langfuse.fullname" . }}-gateway
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
  {{- with .Values.langfuse.gateway.hpa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "langfuse.fullname" . }}-gateway
  minReplicas: {{ .Values.langfuse.gateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.langfuse.gateway.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.langfuse.gateway.hpa.targetCPUUtilizationPercentage }}
{{- end }}
