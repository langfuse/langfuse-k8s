{{/*
Chart-managed Langfuse application Secret (salt, encryption-key, nextauth-secret).

Generated on first install when the corresponding value / secretKeyRef is unset,
and persisted across upgrades via lookup — same pattern as the Postgres /
ClickHouse / Redis / S3 auth Secrets. Users can still supply their own values
or secretKeyRefs to opt out of auto-generation per key.
*/}}
{{- $name := include "langfuse.appSecretName" . -}}
{{- $saltProvided := or .Values.langfuse.salt.value (and .Values.langfuse.salt.secretKeyRef.name .Values.langfuse.salt.secretKeyRef.key) -}}
{{- $encProvided := or .Values.langfuse.encryptionKey.value (and .Values.langfuse.encryptionKey.secretKeyRef.name .Values.langfuse.encryptionKey.secretKeyRef.key) -}}
{{- $nextProvided := or .Values.langfuse.nextauth.secret.value (and .Values.langfuse.nextauth.secret.secretKeyRef.name .Values.langfuse.nextauth.secret.secretKeyRef.key) -}}
{{- if or (not $saltProvided) (not $encProvided) (not $nextProvided) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $salt := "" -}}
{{- if not $saltProvided -}}
  {{- if and $existing (index $existing.data "salt") -}}
    {{- $salt = index $existing.data "salt" | b64dec -}}
  {{- else -}}
    {{- $salt = randAlphaNum 32 | b64enc -}}
  {{- end -}}
{{- end -}}
{{- $enc := "" -}}
{{- if not $encProvided -}}
  {{- if and $existing (index $existing.data "encryption-key") -}}
    {{- $enc = index $existing.data "encryption-key" | b64dec -}}
  {{- else -}}
    {{- /* 256-bit hex key (64 hex chars), matching `openssl rand -hex 32`. */ -}}
    {{- $enc = randAlphaNum 64 | sha256sum -}}
  {{- end -}}
{{- end -}}
{{- $next := "" -}}
{{- if not $nextProvided -}}
  {{- if and $existing (index $existing.data "nextauth-secret") -}}
    {{- $next = index $existing.data "nextauth-secret" | b64dec -}}
  {{- else -}}
    {{- $next = randAlphaNum 32 | b64enc -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not $saltProvided }}
  salt: {{ $salt | b64enc | quote }}
  {{- end }}
  {{- if not $encProvided }}
  encryption-key: {{ $enc | b64enc | quote }}
  {{- end }}
  {{- if not $nextProvided }}
  nextauth-secret: {{ $next | b64enc | quote }}
  {{- end }}
{{- end }}
