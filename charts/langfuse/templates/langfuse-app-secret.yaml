{{- /*
Chart-managed Secret for app credentials Langfuse cannot regenerate:
SALT (API-key hashes), ENCRYPTION_KEY (encrypted columns), NEXTAUTH_SECRET.

Per key: a value already stored in the cluster is preserved verbatim, a
missing credential is generated, and a credential provided via
value/secretKeyRef adds nothing new (the pod env reads the user's source
directly) — so switching a credential from generated to provided can never
destroy the generated value, and helm.sh/resource-policy keeps the Secret
through uninstall. Losing SALT or ENCRYPTION_KEY is unrecoverable.

The AI gateway keys (ai-gateway-service-key, ai-gateway-jwt-private-key) are
generated only while langfuse.gateway.enabled is true, so existing installs
get no new keys. Losing them is recoverable: a restart of web and the gateway
picks up the new values, and ingestion tokens live 15 minutes.

Caveat: under helm-template-based GitOps (e.g. ArgoCD) `lookup` cannot see
the cluster, so generated values would rotate on every sync — pin salt,
encryptionKey, nextauth.secret, and the gateway's serviceKey and
jwt.privateKey via value/secretKeyRef there. A rotated service key fails
gateway requests until both web and the gateway restart.
*/ -}}
{{- $saltProvided := or .Values.langfuse.salt.value (and .Values.langfuse.salt.secretKeyRef.name .Values.langfuse.salt.secretKeyRef.key) -}}
{{- $encProvided := or .Values.langfuse.encryptionKey.value (and .Values.langfuse.encryptionKey.secretKeyRef.name .Values.langfuse.encryptionKey.secretKeyRef.key) -}}
{{- $nextProvided := or .Values.langfuse.nextauth.secret.value (and .Values.langfuse.nextauth.secret.secretKeyRef.name .Values.langfuse.nextauth.secret.secretKeyRef.key) -}}
{{- $gw := .Values.langfuse.gateway | default dict -}}
{{- $gwServiceKey := $gw.serviceKey | default dict -}}
{{- $gwPrivateKey := ($gw.jwt | default dict).privateKey | default dict -}}
{{- $gwServiceKeyProvided := or $gwServiceKey.value (and ($gwServiceKey.secretKeyRef | default dict).name ($gwServiceKey.secretKeyRef | default dict).key) -}}
{{- $gwPrivateKeyProvided := or $gwPrivateKey.value (and ($gwPrivateKey.secretKeyRef | default dict).name ($gwPrivateKey.secretKeyRef | default dict).key) -}}
{{- $name := include "langfuse.appSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- /* A Secret stored with no keys has no .data field at all — e.g. the one
this template creates when every credential is provided — so guard the index
against nil or upgrades fail with "index of untyped nil". */ -}}
{{- $existingData := dict -}}
{{- if $existing -}}{{- $existingData = $existing.data | default dict -}}{{- end -}}
{{- $data := dict -}}
{{- range $key, $provided := dict "salt" $saltProvided "encryption-key" $encProvided "nextauth-secret" $nextProvided "ai-gateway-service-key" $gwServiceKeyProvided "ai-gateway-jwt-private-key" $gwPrivateKeyProvided -}}
  {{- if index $existingData $key -}}
    {{- $_ := set $data $key (index $existingData $key) -}}
  {{- else if and (not $provided) (or $gw.enabled (not (hasPrefix "ai-gateway-" $key))) -}}
    {{- if or (eq $key "encryption-key") (eq $key "ai-gateway-service-key") -}}
      {{- $_ := set $data $key (randAlphaNum 64 | sha256sum | b64enc) -}}
    {{- else if eq $key "ai-gateway-jwt-private-key" -}}
      {{- $_ := set $data $key (genPrivateKey "ecdsa" | b64enc) -}}
    {{- else -}}
      {{- $_ := set $data $key (randAlphaNum 32 | b64enc) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
  annotations:
    # Never garbage-collect generated credentials, even on uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
