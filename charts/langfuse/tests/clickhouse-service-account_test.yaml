suite: test ClickHouse service account selection
templates:
  - clickhouse/cluster.yaml
  - clickhouse/keeper.yaml
tests:
  - it: should preserve operator pod-template defaults when unset
    values:
      - ../values.lint.yaml
    asserts:
      - notExists:
          path: spec.podTemplate
        template: clickhouse/cluster.yaml
      - notExists:
          path: spec.podTemplate
        template: clickhouse/keeper.yaml

  - it: should select an existing account without changing Keeper identity
    values:
      - ../values.lint.yaml
    set:
      clickhouse.cluster.serviceAccountName: clickhouse-storage
    asserts:
      - equal:
          path: spec.podTemplate.serviceAccountName
          value: clickhouse-storage
        template: clickhouse/cluster.yaml
      - notExists:
          path: spec.podTemplate
        template: clickhouse/keeper.yaml

  - it: should preserve other pod-template settings
    values:
      - ../values.lint.yaml
    set:
      clickhouse.cluster.serviceAccountName: clickhouse-storage
      clickhouse.cluster.nodeSelector:
        workload: database
      clickhouse.cluster.priorityClassName: database-critical
      clickhouse.cluster.image.pullSecrets:
        - name: registry-auth
    asserts:
      - equal:
          path: spec.podTemplate
          value:
            serviceAccountName: clickhouse-storage
            imagePullSecrets:
              - name: registry-auth
            nodeSelector:
              workload: database
            priorityClassName: database-critical
        template: clickhouse/cluster.yaml

  - it: should not create a cluster when deployment is disabled
    values:
      - ../values.lint.yaml
    set:
      clickhouse.deploy: false
      clickhouse.cluster.serviceAccountName: clickhouse-storage
    asserts:
      - hasDocuments:
          count: 0
        template: clickhouse/cluster.yaml
