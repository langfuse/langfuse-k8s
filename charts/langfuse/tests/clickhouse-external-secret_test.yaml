suite: test ClickHouse external Secret
templates:
  - clickhouse/cluster.yaml
tests:
  - it: should not configure an external Secret by default
    values:
      - ../values.lint.yaml
    asserts:
      - notExists:
          path: spec.externalSecret
        template: clickhouse/cluster.yaml

  - it: should not fail when the externalSecret map is missing (upgrade with reused values)
    values:
      - ../values.lint.yaml
    set:
      clickhouse.cluster.externalSecret: null
    asserts:
      - notExists:
          path: spec.externalSecret
        template: clickhouse/cluster.yaml

  - it: should default the policy to Observe when only the name is set
    values:
      - ../values.lint.yaml
    set:
      clickhouse.cluster.externalSecret.name: langfuse-v2-clickhouse
      clickhouse.cluster.externalSecret.policy: ""
    asserts:
      - equal:
          path: spec.externalSecret
          value:
            name: langfuse-v2-clickhouse
            policy: Observe
        template: clickhouse/cluster.yaml

  - it: should pass a non-default policy through to the operator
    values:
      - ../values.lint.yaml
    set:
      clickhouse.cluster.externalSecret.name: langfuse-v2-clickhouse
      clickhouse.cluster.externalSecret.policy: Manage
    asserts:
      - equal:
          path: spec.externalSecret
          value:
            name: langfuse-v2-clickhouse
            policy: Manage
        template: clickhouse/cluster.yaml
