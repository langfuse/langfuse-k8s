suite: test nextauth.url
templates:
  - web/deployment.yaml
tests:
  - it: should render templates in nextauth.url
    values:
      - ../values.lint.yaml
    set:
      global.domain: example.com
      langfuse.nextauth.url: "https://langfuse.{{ .Values.global.domain }}"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXTAUTH_URL
            value: https://langfuse.example.com
