suite: test ClickHouse image pull secrets
templates:
  - clickhouse/cluster.yaml
  - clickhouse/keeper.yaml
tests:
  - it: should not set imagePullSecrets by default
    values:
      - ../values.lint.yaml
    asserts:
      - notExists:
          path: spec.podTemplate
        template: clickhouse/cluster.yaml
      - notExists:
          path: spec.podTemplate
        template: clickhouse/keeper.yaml

  - it: should set imagePullSecrets on the ClickHouseCluster and KeeperCluster pod templates
    values:
      - ../values.lint.yaml
    set:
      clickhouse.cluster.image.pullSecrets:
        - name: clickhouse-registry
      clickhouse.keeper.image.pullSecrets:
        - name: keeper-registry
    asserts:
      - equal:
          path: spec.podTemplate.imagePullSecrets
          value:
            - name: clickhouse-registry
        template: clickhouse/cluster.yaml
      - equal:
          path: spec.podTemplate.imagePullSecrets
          value:
            - name: keeper-registry
        template: clickhouse/keeper.yaml

  - it: should keep other pod template fields alongside imagePullSecrets
    values:
      - ../values.lint.yaml
    set:
      clickhouse.cluster.image.pullSecrets:
        - name: clickhouse-registry
      clickhouse.cluster.priorityClassName: clickhouse-critical
    asserts:
      - equal:
          path: spec.podTemplate.imagePullSecrets
          value:
            - name: clickhouse-registry
        template: clickhouse/cluster.yaml
      - equal:
          path: spec.podTemplate.priorityClassName
          value: clickhouse-critical
        template: clickhouse/cluster.yaml
      - notExists:
          path: spec.podTemplate
        template: clickhouse/keeper.yaml
