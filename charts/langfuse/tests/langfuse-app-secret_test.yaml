suite: test chart-managed langfuse app secret
templates:
  - langfuse-app-secret.yaml
  - web/deployment.yaml
tests:
  - it: should render the app secret when credentials are not provided
    values:
      - ../values.lint.yaml
    set:
      langfuse.salt.value: ""
      langfuse.encryptionKey.value: ""
      langfuse.nextauth.secret.value: ""
    asserts:
      - hasDocuments:
          count: 1
        template: langfuse-app-secret.yaml
      - isKind:
          of: Secret
        template: langfuse-app-secret.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langfuse-app
        template: langfuse-app-secret.yaml
      - isNotEmpty:
          path: data.salt
        template: langfuse-app-secret.yaml
      - isNotEmpty:
          path: data["encryption-key"]
        template: langfuse-app-secret.yaml
      - isNotEmpty:
          path: data["nextauth-secret"]
        template: langfuse-app-secret.yaml

  - it: should keep the app secret object but add no keys when all credentials are provided inline
    values:
      - ../values.lint.yaml
    set:
      langfuse.salt.value: "provided-salt"
      langfuse.encryptionKey.value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      langfuse.nextauth.secret.value: "provided-nextauth"
    asserts:
      # The Secret object stays in the release (resource-policy keep) so a
      # previously generated salt/encryption-key is never deleted; provided
      # credentials just stop new keys from being generated.
      - hasDocuments:
          count: 1
        template: langfuse-app-secret.yaml
      - notExists:
          path: data.salt
        template: langfuse-app-secret.yaml
      - notExists:
          path: data["encryption-key"]
        template: langfuse-app-secret.yaml
      - notExists:
          path: data["nextauth-secret"]
        template: langfuse-app-secret.yaml
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        template: langfuse-app-secret.yaml

  - it: should upgrade cleanly when the existing app secret has no data keys
    values:
      - ../values.lint.yaml
    set:
      langfuse.salt.value: "provided-salt"
      langfuse.encryptionKey.value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      langfuse.nextauth.secret.value: "provided-nextauth"
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        # What a provided-only install stores: the Secret exists but carries no
        # .data field at all. The lookup-and-copy logic must tolerate that
        # instead of failing the upgrade with "index of untyped nil".
        - apiVersion: v1
          kind: Secret
          metadata:
            name: RELEASE-NAME-langfuse-app
            namespace: NAMESPACE
          type: Opaque
    asserts:
      - hasDocuments:
          count: 1
        template: langfuse-app-secret.yaml
      - notExists:
          path: data.salt
        template: langfuse-app-secret.yaml
      - notExists:
          path: data["encryption-key"]
        template: langfuse-app-secret.yaml
      - notExists:
          path: data["nextauth-secret"]
        template: langfuse-app-secret.yaml

  - it: should preserve existing generated keys verbatim on upgrade
    values:
      - ../values.lint.yaml
    set:
      langfuse.salt.value: ""
      langfuse.encryptionKey.value: ""
      langfuse.nextauth.secret.value: ""
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: RELEASE-NAME-langfuse-app
            namespace: NAMESPACE
          type: Opaque
          data:
            salt: ZXhpc3Rpbmctc2FsdA==
            encryption-key: ZXhpc3Rpbmcta2V5
            nextauth-secret: ZXhpc3RpbmctbmV4dGF1dGg=
    asserts:
      - equal:
          path: data.salt
          value: ZXhpc3Rpbmctc2FsdA==
        template: langfuse-app-secret.yaml
      - equal:
          path: data["encryption-key"]
          value: ZXhpc3Rpbmcta2V5
        template: langfuse-app-secret.yaml
      - equal:
          path: data["nextauth-secret"]
          value: ZXhpc3RpbmctbmV4dGF1dGg=
        template: langfuse-app-secret.yaml

  - it: should prefer an explicit secretKeyRef over the chart-managed app secret
    values:
      - ../values.lint.yaml
    set:
      langfuse.salt.value: ""
      langfuse.salt.secretKeyRef.name: my-secrets
      langfuse.salt.secretKeyRef.key: salt
      langfuse.encryptionKey.value: ""
      langfuse.encryptionKey.secretKeyRef.name: my-secrets
      langfuse.encryptionKey.secretKeyRef.key: encryption-key
      langfuse.nextauth.secret.value: ""
      langfuse.nextauth.secret.secretKeyRef.name: my-secrets
      langfuse.nextauth.secret.secretKeyRef.key: nextauth-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SALT
            valueFrom:
              secretKeyRef:
                name: my-secrets
                key: salt
        template: web/deployment.yaml
