suite: test chart-managed langfuse app secret
templates:
  - langfuse-app-secret.yaml
  - web/deployment.yaml
tests:
  - it: should render the app secret when credentials are not provided
    values:
      - ../values.lint.yaml
    set:
      langfuse.salt.value: ""
      langfuse.encryptionKey.value: ""
      langfuse.nextauth.secret.value: ""
    asserts:
      - hasDocuments:
          count: 1
        template: langfuse-app-secret.yaml
      - isKind:
          of: Secret
        template: langfuse-app-secret.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langfuse-app
        template: langfuse-app-secret.yaml
      - isNotEmpty:
          path: data.salt
        template: langfuse-app-secret.yaml
      - isNotEmpty:
          path: data["encryption-key"]
        template: langfuse-app-secret.yaml
      - isNotEmpty:
          path: data["nextauth-secret"]
        template: langfuse-app-secret.yaml

  - it: should skip the app secret when all credentials are provided inline
    values:
      - ../values.lint.yaml
    set:
      langfuse.salt.value: "provided-salt"
      langfuse.encryptionKey.value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      langfuse.nextauth.secret.value: "provided-nextauth"
    asserts:
      - hasDocuments:
          count: 0
        template: langfuse-app-secret.yaml

  - it: should prefer an explicit secretKeyRef over the chart-managed app secret
    values:
      - ../values.lint.yaml
    set:
      langfuse.salt.value: ""
      langfuse.salt.secretKeyRef.name: my-secrets
      langfuse.salt.secretKeyRef.key: salt
      langfuse.encryptionKey.value: ""
      langfuse.encryptionKey.secretKeyRef.name: my-secrets
      langfuse.encryptionKey.secretKeyRef.key: encryption-key
      langfuse.nextauth.secret.value: ""
      langfuse.nextauth.secret.secretKeyRef.name: my-secrets
      langfuse.nextauth.secret.secretKeyRef.key: nextauth-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SALT
            valueFrom:
              secretKeyRef:
                name: my-secrets
                key: salt
        template: web/deployment.yaml
