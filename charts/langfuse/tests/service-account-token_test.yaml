suite: test service account token automount
templates:
  - serviceaccount.yaml
  - web/deployment.yaml
  - worker/deployment.yaml
  - gateway/deployment.yaml
tests:
  - it: should not mount the service account token by default
    values:
      - ../values.lint.yaml
      - ../values.lint.gateway.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: web/deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: worker/deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: gateway/deployment.yaml

  - it: should mount the service account token when enabled
    values:
      - ../values.lint.yaml
      - ../values.lint.gateway.yaml
    set:
      langfuse.serviceAccount.automountServiceAccountToken: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
        template: web/deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
        template: worker/deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
        template: gateway/deployment.yaml

  - it: should not mount the token with an existing service account
    values:
      - ../values.lint.yaml
    set:
      langfuse.serviceAccount.create: false
      langfuse.serviceAccount.name: existing
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing
        template: web/deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: web/deployment.yaml
