# Langfuse v4 installation that connects to an external ClickHouse cluster managed by
# the ClickHouse Kubernetes Operator (see clickhouse-cluster.yaml). Postgres, Valkey and
# SeaweedFS are deployed by the chart with auto-generated credentials.
#
# Apply secret.yaml (app secrets only) and create langfuse-clickhouse-auth before install.
langfuse:
  image:
    tag: "4" # Pick a current Langfuse v4 release. We recommend pinning a version, e.g. 4.0.0

  encryptionKey:
    secretKeyRef:
      name: langfuse
      key: encryption-key

  salt:
    secretKeyRef:
      name: langfuse
      key: salt

  nextauth:
    secret:
      secretKeyRef:
        name: langfuse
        key: nextauth-secret

postgresql:
  deploy: true

clickhouse:
  deploy: false
  host: langfuse-clickhouse-headless # FQDN: langfuse-clickhouse-headless.langfuse.svc.cluster.local
  auth:
    username: default
    existingSecret: langfuse-clickhouse-auth
    existingSecretKey: password

redis:
  deploy: true

s3:
  deploy: true
