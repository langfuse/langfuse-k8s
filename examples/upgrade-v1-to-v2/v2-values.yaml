# v2.0 TARGET values for the blue/green online-sync migration.
# Install as a SECOND release alongside v1:
#   helm install langfuse-v2 ... -n langfuse -f v2-values.yaml
#
# Sub-component credentials are generated by the chart. The three Langfuse
# application secrets MUST match v1 (point at the same Secret).
langfuse:
  salt:
    secretKeyRef:
      name: langfuse
      key: salt
  encryptionKey:
    secretKeyRef:
      name: langfuse
      key: encryption-key
  nextauth:
    secret:
      secretKeyRef:
        name: langfuse
        key: nextauth-secret

postgresql:
  deploy: true

clickhouse:
  deploy: true
  cluster:
    replicas: 1
    resources:
      requests:
        cpu: "1"
        memory: "4Gi"
      limits:
        memory: "8Gi"
  keeper:
    replicas: 3

redis:
  deploy: true

s3:
  deploy: true
