# ingress-nginx with cert-manager. Replace the hostnames and the cluster issuer name.
langfuse:
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: langfuse.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: langfuse-tls

  gateway:
    ingress:
      enabled: true
      className: nginx
      annotations:
        # Separate certificate for the gateway host (different secretName than web's).
        cert-manager.io/cluster-issuer: letsencrypt
        # Streams run up to 600 s and may be quiet for up to 120 s.
        nginx.ingress.kubernetes.io/proxy-read-timeout: "620"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "620"
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-body-size: "17m"
      # The first host is also the URL web shows users (LANGFUSE_AI_GATEWAY_PUBLIC_URL), over
      # https because TLS is enabled. Set langfuse.gateway.publicUrl to override it.
      hosts:
        - gateway.langfuse.example.com
      tls:
        enabled: true
        secretName: langfuse-gateway-tls
