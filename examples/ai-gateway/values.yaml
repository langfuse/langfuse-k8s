# Enables the AI gateway on top of examples/minimal-installation, with the gateway keys
# taken from the pre-created secret in secret.yaml.
#
# To let the chart generate the keys into <release>-app instead, remove serviceKey and jwt.
# Don't do that under helm-template based GitOps (e.g. ArgoCD), where the generated keys
# would rotate on every sync.
langfuse:
  gateway:
    enabled: true
    serviceKey:
      secretKeyRef:
        name: langfuse-ai-gateway
        key: service-key
    jwt:
      privateKey:
        secretKeyRef:
          name: langfuse-ai-gateway
          key: jwt-private-key
