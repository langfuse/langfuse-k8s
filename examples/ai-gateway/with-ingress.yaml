langfuse:
  nextauth:
    url: http://langfuse.example.com
  ingress:
    enabled: true
    # This requires an ingress controller to be installed in the cluster
    # For example, using the nginx ingress controller:
    # helm install nginx-ingress ingress-nginx/ingress-nginx
    className: nginx
    hosts:
    - host: langfuse.example.com
      paths:
      - path: /
        pathType: Prefix
  gateway:
    ingress:
      enabled: true
      className: nginx
      annotations:
        # Streams run up to 600 s and may be quiet for up to 120 s.
        nginx.ingress.kubernetes.io/proxy-read-timeout: "620"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "620"
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
        # Request bodies larger than nginx's 1m default, e.g. prompts with images.
        nginx.ingress.kubernetes.io/proxy-body-size: "17m"
      # Also the gateway URL web shows users, unless langfuse.gateway.publicUrl is set.
      hosts:
      - gateway.langfuse.example.com
