# Pinned AI gateway keys. Apply before installing, or manage them with your secret tooling
# (e.g. External Secrets Operator). Web and the gateway share the service key; only web holds
# the JWT private key and derives the public key and key id from it.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: langfuse-ai-gateway
stringData:
  # Generate with `openssl rand -hex 32`
  service-key: "your-service-key"
  # ES256 (P-256) private key, PKCS8 or SEC1 PEM. Generate with
  # `openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256`
  jwt-private-key: |
    -----BEGIN PRIVATE KEY-----
    replace-with-your-key
    -----END PRIVATE KEY-----
