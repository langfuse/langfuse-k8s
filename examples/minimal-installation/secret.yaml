# Optional. The chart auto-generates salt / encryption-key / nextauth-secret into
# `<release>-app` when these are left unset. Apply this Secret and reference it from
# values only when you need to pin known credentials (e.g. migrating existing data):
#
#   langfuse:
#     salt:
#       secretKeyRef: { name: langfuse, key: salt }
#     encryptionKey:
#       secretKeyRef: { name: langfuse, key: encryption-key }
#     nextauth:
#       secret:
#         secretKeyRef: { name: langfuse, key: nextauth-secret }
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: langfuse
stringData:
  salt: "replace-with-openssl-rand-base64-32"
  encryption-key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" # openssl rand -hex 32
  nextauth-secret: "replace-with-openssl-rand-base64-32"
