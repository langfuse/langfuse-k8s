apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: langfuse
stringData:
  # Langfuse application
  salt: "your-salt"
  encryption-key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" # Generate with `openssl rand -hex 32`
  nextauth-secret: "your-nextauth-secret"

  # PostgreSQL — Langfuse reads `postgresql-password`; the groundhog2k sub-chart
  # also needs the POSTGRES_* / USERDB_* keys (keep passwords in sync).
  postgresql-password: "your-postgresql-password"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "your-postgresql-password"
  POSTGRES_DB: "langfuse"
  USERDB_USER: "langfuse"
  USERDB_PASSWORD: "your-postgresql-password"

  # ClickHouse
  clickhouse-password: "your-clickhouse-password"

  # Redis / Valkey — Langfuse reads `redis-password`; Valkey ACL uses key == username (`default`).
  redis-password: "your-redis-password"
  default: "your-redis-password"

  # SeaweedFS S3 — Langfuse reads s3-user / s3-password; the gateway also needs the IAM JSON.
  s3-user: "your-s3-user"
  s3-password: "your-s3-password"
  seaweedfs_s3_config: |
    {"identities":[{"name":"your-s3-user","credentials":[{"accessKey":"your-s3-user","secretKey":"your-s3-password"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
