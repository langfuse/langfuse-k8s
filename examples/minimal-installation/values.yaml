# Minimal Langfuse v2 / Langfuse v4 installation.
# Application secrets (salt, encryptionKey, nextauth.secret) and all datastore
# credentials are auto-generated by the chart on first install — no Secret
# manifest is required. To pin app secrets yourself, see secret.yaml.
#
# Prerequisites (once per cluster): cert-manager + ClickHouse operator
# (see README.md in this directory).
postgresql:
  deploy: true

# Renders ClickHouseCluster + KeeperCluster CRs; the cluster-wide
# clickhouse-operator turns them into pods. Requires operator CRDs to be present.
clickhouse:
  deploy: true
  keeper:
    # Use 1 Keeper replica for local/dev; use 3 for production HA.
    replicas: 1

redis:
  deploy: true

s3:
  deploy: true
