# This values.yaml file demonstrates how to use the basic chart with a single, pre-created secret.
# Secrets must be set manually or via External Secrets Operator like https://external-secrets.io/latest
# or any other secret management tool.
#
# Apply secret.yaml before installing. The same Secret feeds Langfuse and the bundled
# Postgres / Valkey / SeaweedFS / ClickHouse deployments.
langfuse:
  encryptionKey:
    secretKeyRef:
      name: langfuse
      key: encryption-key

  salt:
    secretKeyRef:
      name: langfuse
      key: salt

  nextauth:
    secret:
      secretKeyRef:
        name: langfuse
        key: nextauth-secret

postgresql:
  auth:
    existingSecret: langfuse
    secretKeys:
      adminPasswordKey: postgresql-password
      userPasswordKey: postgresql-password
  # groundhog2k reads these keys from the same Secret (see secret.yaml)
  settings:
    existingSecret: langfuse
  userDatabase:
    existingSecret: langfuse

clickhouse:
  auth:
    existingSecret: langfuse
    existingSecretKey: clickhouse-password

redis:
  auth:
    existingSecret: langfuse
    existingSecretPasswordKey: redis-password
    # Valkey ACL Secret (key name == username, see secret.yaml `default`)
    usersExistingSecret: langfuse

s3:
  auth:
    existingSecret: langfuse
    rootUserSecretKey: s3-user
    rootPasswordSecretKey: s3-password
  allInOne:
    s3:
      # SeaweedFS IAM config JSON lives under key `seaweedfs_s3_config` in secret.yaml
      existingConfigSecret: langfuse
